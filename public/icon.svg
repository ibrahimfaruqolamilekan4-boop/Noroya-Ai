      <stop offset="0%" stop-color="#0B0E14" />
      <stop offset="100%" stop-color="#131926" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="#1E293B" stroke-width="4" />
  <!-- Institutional Candlestick & SMC Order Block Graphic -->
  <rect x="88" y="280" width="336" height="64" rx="8" fill="#06B6D4" fill-opacity="0.16" stroke="#06B6D4" stroke-width="2" stroke-dasharray="8 6" />
