  <rect x="352" y="120" width="40" height="100" rx="6" fill="url(#accentGrad)" />
  <!-- Trajectory Line -->
  <path d="M 104 360 L 195 295 L 270 320 L 408 112" fill="none" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
